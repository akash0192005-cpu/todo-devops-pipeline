- name: Install Python runtime
  ansible.builtin.package:
    name:
      - python3
      - "{{ python_package }}"
      - "{{ python_pip_package }}"
    state: present

- name: Create application group
  ansible.builtin.group:
    name: "{{ app_group }}"
    system: true

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    create_home: false

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'

- name: Copy application source
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/"
    dest: "{{ app_dir }}/app/"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: preserve
  notify: Restart Todo API

- name: Install Flask in virtual environment
  ansible.builtin.pip:
    name: Flask==3.1.1
    virtualenv: "{{ app_dir }}/venv"
    virtualenv_command: python3 -m venv
  become_user: "{{ app_user }}"

- name: Install systemd service
  ansible.builtin.template:
    src: todo-api.service.j2
    dest: /etc/systemd/system/{{ app_name }}.service
    mode: '0644'
  notify: Restart Todo API

- name: Enable and start Todo API
  ansible.builtin.systemd:
    name: "{{ app_name }}"
    enabled: true
    state: started
    daemon_reload: true
